name: CodexMemoShareMacOS
options:
  minimumXcodeGenVersion: 2.44.0
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  CodexMemoShare:
    type: application
    platform: macOS
    sources:
      - path: HostApp
      - path: Shared
    info:
      path: HostApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hideki.codex-memo-share
        PRODUCT_NAME: codex-memo-share
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: codex-memo
        INFOPLIST_KEY_CFBundleName: codex-memo
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    dependencies:
      - target: CodexMemoShareExtension
        embed: true
      - target: CodexMemoMarkdownQuickLookExtension
        embed: true

  CodexMemoShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: codex-memo
        CFBundleName: codex-memo
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (
                  extensionItems,
                  $extensionItem,
                  SUBQUERY(
                      $extensionItem.attachments,
                      $attachment,
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" ||
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.active-webpage" ||
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url" ||
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" ||
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
                  ).@count == $extensionItem.attachments.@count
                  AND SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url").@count <= 1
                  AND SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.active-webpage").@count <= 1
                  AND SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url").@count <= 10
                  AND SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count <= 10
              ).@count == 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hideki.codex-memo-share.extension
        PRODUCT_NAME: codex-memo
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    dependencies:
      - sdk: Social.framework
      - sdk: UniformTypeIdentifiers.framework

  CodexMemoMarkdownQuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLookExtension
      - path: Shared
    info:
      path: QuickLookExtension/Info.plist
      properties:
        CFBundleDisplayName: codex-memo Markdown Preview
        CFBundleName: codex-memo Markdown Preview
        NSExtension:
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hideki.codex-memo-share.quicklook
        PRODUCT_NAME: CodexMemoMarkdownPreview
        PRODUCT_MODULE_NAME: CodexMemoMarkdownPreview
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: QuickLookExtension/QuickLookExtension.entitlements
    dependencies:
      - sdk: Quartz.framework
      - sdk: WebKit.framework

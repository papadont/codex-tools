<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>codex-memo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const originalWarn = console.warn.bind(console);
        console.warn = (...args) => {
          const first = String(args && args[0] ? args[0] : "");
          if (first.includes("cdn.tailwindcss.com should not be used in production")) {
            return;
          }
          originalWarn(...args);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <style>
      .local-path-link {
        color: #4e6f9f;
        text-decoration: none;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .local-path-link:hover {
        text-decoration: underline;
      }
      .usage-ref-link,
      .usage-refs-trigger {
        color: #4e6f9f;
        text-decoration: none;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .usage-ref-link:hover,
      .usage-refs-trigger:hover {
        text-decoration: underline;
      }
      .markdown-preview a[href^="http://"],
      .markdown-preview a[href^="https://"],
      .markdown-preview a[data-attachment-link="true"] {
        color: #4e6f9f;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .markdown-preview li::marker {
        color: #a98b66;
      }
      .markdown-preview .md-dash-list-item {
        position: relative;
        display: block !important;
        margin-left: 0;
        padding-left: 1.05em;
      }
      .markdown-preview .md-dash-list-item::before {
        content: "-";
        position: absolute;
        left: 0;
        color: #a98b66;
        opacity: 0.9;
      }
      .quick-memo-thread {
        background: transparent !important;
        border-color: transparent !important;
        box-shadow: none !important;
        color: #4f5f7e !important;
        font-size: 13px !important;
        line-height: 1rem !important;
        font-weight: 700 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      .quick-memo-thread::placeholder {
        color: #4f5f7e;
      }
      #usagePanelSlot.sticky-slot-scrolled {
        box-shadow: 0 8px 14px -12px rgba(92, 78, 57, 0.45);
        border-bottom: 1px solid rgba(201, 191, 177, 0.9);
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#f7f5f1] p-2 text-[#4b5568]">
    <div class="mx-auto min-h-[calc(100vh-1rem)] max-w-[1320px] overflow-hidden rounded-2xl border border-[#ebe7e0] bg-[#fffefd]">
      <header class="flex items-center gap-1.5 overflow-x-auto border-b border-[#f1ece4] bg-[#fffefd] px-2.5 py-1.5 whitespace-nowrap">
        <div class="ml-1 mr-1 inline-flex shrink-0 items-center gap-1.5">
          <button id="autoRefreshIndicator" tabindex="-1" type="button" class="h-2.5 w-2.5 rounded-full border border-transparent" title="Auto refresh"></button>
          <h1 id="appTitle" class="cursor-pointer select-none text-sm font-semibold text-[#5e6f8d]" title="Double-click to reload">codex-memo</h1>
          <button id="modeBadge" type="button" class="inline-flex h-5 items-center rounded-md border bg-transparent px-1 text-[10px] font-semibold leading-none" title="Mode">-</button>
        </div>
        <input id="qInput" type="search" placeholder="Search" class="h-7 w-[190px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]" />
        <input id="projectInput" type="search" placeholder="projectName" class="h-7 w-[152px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]" />
        <div class="ml-0.5 flex items-center gap-1.5">
          <select id="typeSelect" tabindex="-1" class="h-7 w-[98px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]">
            <option value="">Types</option>
            <option value="memo">memo</option>
            <option value="handover memo">handover</option>
            <option value="propomemo">propo</option>
            <option value="keep">keep</option>
          </select>
          <div id="storageFilterWrap" class="flex items-center">
            <select id="storageFilterSelect" tabindex="-1" class="h-7 w-[98px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]">
              <option value="">Storages</option>
            </select>
          </div>
          <button id="newBtn" tabindex="-1" type="button" aria-label="New memo" title="New memo" class="ml-3 inline-flex h-7 w-7 items-center justify-center rounded-lg border border-[#e7e1d7] bg-[#fefdfb] p-0 hover:border-[#7f90b0]">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-[#6e7d99]" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>
          <button id="saveBtn" tabindex="-1" type="button" class="h-7 rounded-lg border border-[#6e84ad] bg-[#6e84ad] px-2 text-xs text-[#f7f9ff] hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-45 disabled:hover:brightness-100">Save</button>
          <button id="deleteBtn" tabindex="-1" type="button" class="h-7 rounded-lg border border-[#cf7896] bg-[#cf7896] px-2 text-xs text-[#fff7fb] hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-45 disabled:hover:brightness-100">Delete</button>
        </div>
      </header>

      <main class="relative grid h-[calc(100vh-74px)] grid-cols-1 md:grid-cols-[300px_minmax(0,1fr)]">
        <aside id="memoSidebar" class="overflow-auto border-b border-[#ebe4d9] bg-[#fbf8f3] p-3 md:border-b-0 md:border-r">
          <div id="usagePanelSlot" class="-mt-3 sticky -top-3 z-10 -mx-3 bg-[#fbf8f3] px-3 pb-[5px] transition-shadow duration-150"></div>
          <ul id="memoList" class="space-y-1"></ul>
        </aside>

        <section class="relative flex h-full min-h-0 min-w-0 flex-col overflow-x-hidden overflow-y-auto bg-[#fefcf9] px-4 pb-1 pt-2">
          <div class="mb-2 flex flex-wrap items-end gap-2">
            <div class="w-full md:w-[210px]">
              <div class="flex h-7 items-center gap-2">
                <label for="projectNameInput" class="shrink-0 text-[11px] text-[#7a8398]">project</label>
                <input id="projectNameInput" type="text" class="h-7 min-w-0 flex-1 rounded-lg border border-[#d4d8e0] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]" />
              </div>
            </div>
            <div class="w-full md:w-[98px]">
              <select id="memoTypeInput" tabindex="-1" class="h-7 w-full rounded-lg border border-[#d4d8e0] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]">
                <option value="memo">memo</option>
                <option value="handover memo">handover</option>
                <option value="propomemo">propo</option>
                <option value="keep">keep</option>
              </select>
            </div>
            <div aria-hidden="true" class="hidden h-5 w-px self-center bg-[#e2ddd4] md:block"></div>
            <div class="w-full md:w-[192px]">
              <div class="flex items-center gap-1">
                <select id="downloadFormatSelect" tabindex="-1" aria-label="Download format" class="h-7 w-[62px] rounded-lg border border-[#d4d8e0] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]">
                <option value="txt">txt</option>
                <option value="md">md</option>
                <option value="json">json</option>
                </select>
                <button id="downloadBtn" tabindex="-1" type="button" aria-label="Download" title="Download" class="ml-0.5 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-[#d4d8e0] bg-[#fefdfb] p-0 hover:border-[#7f90b0]">
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="h-[18px] w-[18px] fill-none stroke-[#6e7d99]" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v9"></path>
                    <path d="m8.5 10.5 3.5 3.5 3.5-3.5"></path>
                    <path d="M5 18.5h14"></path>
                  </svg>
                </button>
                <button id="shareBtn" tabindex="-1" type="button" aria-label="Share" title="Share" class="ml-4 inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-[#d4d8e0] bg-[#fefdfb] p-0 hover:border-[#7f90b0]">
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="h-5 w-5 fill-none stroke-[#6e7d99]" stroke-width="1.9">
                    <path d="M12 16V5"></path>
                    <path d="M8.5 8.5 12 5l3.5 3.5"></path>
                    <path d="M6 13.5v3a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-3"></path>
                  </svg>
                </button>
                <button id="summaryBtn" tabindex="-1" type="button" aria-label="AI summary" class="ml-5 inline-flex h-7 items-center gap-px border-0 bg-transparent px-0 text-xs font-semibold text-[#6e84ad] transition-colors duration-150 hover:text-[#db7b57] hover:underline">
                  <svg viewBox="0 0 16 16" aria-hidden="true" class="relative top-[2px] h-4 w-4 fill-none stroke-[#6e9ceb] transition-colors duration-150" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3.5h6"></path>
                    <path d="M3 6.5h6"></path>
                    <path d="M3 9.5h4"></path>
                    <path d="M11.5 6v5"></path>
                    <path d="M9 8.5h5"></path>
                    <rect x="1.75" y="1.75" width="8.5" height="11.5" rx="1.5"></rect>
                  </svg>
                  <span class="relative top-[2px]">Summarize</span>
                </button>
              </div>
            </div>
          </div>

          <div id="editorDivider" class="mb-2 mt-1 border-t border-[#ece7df]"></div>
          <div class="mb-1 flex items-center gap-2">
            <label for="threadTitleInput" class="whitespace-nowrap text-[11px] text-[#7a8398]">thread</label>
            <div class="flex-1">
              <input id="threadTitleInput" type="text" class="h-7 w-full rounded-lg border border-[#d4d8e0] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]" />
            </div>
            <div id="defaultStorageWrap" class="hidden">
              <select id="defaultStorageSelect" tabindex="-1" class="h-7 w-[88px] rounded-lg border border-[#d4d8e0] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]"></select>
            </div>
            <div id="editStorageWrap" class="hidden">
              <select id="editStorageSelect" tabindex="-1" aria-label="Edit storage" class="h-7 w-[88px] rounded-lg border border-[#d4d8e0] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]"></select>
            </div>
            <span id="storageInfo" class="hidden">-</span>
            <button id="bodyModeToggle" tabindex="-1" type="button" aria-label="Toggle body mode" aria-pressed="true" data-mode="preview" class="h-7 w-7 rounded-md border border-[#d4d8e0] bg-[#fefdfb] p-0 text-[10px] font-semibold leading-none text-[#4b5568] outline-none transition-colors hover:border-[#7f90b0] flex items-center justify-center" title="Preview mode">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-current" stroke-width="1.8">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            </button>
          </div>
          <div class="relative mt-0.5 flex min-h-0 flex-1 flex-col">
            <div class="absolute right-3 top-1 z-10 flex items-center gap-2">
              <button id="copyBodyBtn" tabindex="-1" type="button" aria-label="Copy body" class="flex h-5 w-5 items-center justify-center rounded-md border border-transparent bg-[rgba(254,253,251,0.38)] p-0 transition-colors duration-150 hover:border-[rgba(110,125,153,0.18)] hover:bg-[rgba(254,253,251,0.72)]">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="h-[18px] w-[18px] fill-none stroke-[#6e7d99]" stroke-width="1.8">
                  <rect x="9" y="7" width="10" height="10" rx="2"></rect>
                  <rect x="5" y="3" width="10" height="10" rx="2"></rect>
                </svg>
              </button>
            </div>
            <textarea id="memoBodyInput" rows="14" class="h-full min-h-0 flex-1 resize-y rounded-xl border border-[#d4d8e0] bg-[#fefdfb] px-2 py-2 text-sm outline-none focus:border-[#7f90b0]"></textarea>
            <article id="memoPreview" class="markdown-preview hidden h-full min-h-0 flex-1 overflow-auto rounded-xl border border-[#d4d8e0] bg-[#fefdfb] px-3 py-2 text-sm"></article>
          </div>
          <div class="mt-1.5">
            <input id="attachmentInput" type="file" accept="image/*" multiple class="hidden" />
            <div class="flex items-start gap-1.5">
              <button id="addImageBtn" tabindex="-1" type="button" aria-label="Add image" title="Add image" class="inline-flex h-6 w-6 shrink-0 items-center justify-center text-[#5e6f8d] hover:text-[#7f90b0]">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-current" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8.5 12.5 14 7a3 3 0 1 1 4.24 4.24l-7.07 7.07a5 5 0 0 1-7.07-7.07l7.43-7.43"></path>
                </svg>
              </button>
              <div id="attachmentList" class="hidden flex-1 flex-wrap items-center gap-1 text-[10px] text-[#7a8398]"></div>
            </div>
          </div>

        </section>
        <p id="status" class="pointer-events-none fixed bottom-[12px] left-[12px] right-0 z-50 m-0 h-3 overflow-hidden whitespace-nowrap px-[21px] text-[9px] leading-3 text-[#5d79a8] md:pl-[321px]"></p>
      </main>
    </div>

    <script src="/markdown_theme_codex_memo.js?v=20260223-01"></script>
    <script src="/app.js?v=20260301-08"></script>
  </body>
</html>

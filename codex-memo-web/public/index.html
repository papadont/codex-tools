    <style>
      :root {
        --memo-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --memo-font-size: 14px;
      }
      #memoBodyInput,
      #memoPreview {
        font-family: var(--memo-font-family) !important;
        font-size: var(--memo-font-size) !important;
        line-height: 1.65 !important;
      }
      #fontSettingsDialog {
        width: min(480px, calc(100vw - 32px));
        border: 1px solid #c9ced7;
        border-radius: 18px;
        padding: 0;
        background: #fffefd;
        box-shadow: 0 22px 56px rgba(34, 40, 52, 0.22);
        color: #4b5568;
      }
      #fontSettingsDialog::backdrop {
        background: rgba(44, 48, 56, 0.18);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }
      .font-settings-shell {
        padding: 16px 18px 14px;
      }
      .font-settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .font-settings-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .font-settings-copy {
        margin: 4px 0 0;
        font-size: 12px;
        color: #768196;
      }
      .font-settings-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        gap: 10px 12px;
      }
      .font-settings-field label {
        display: block;
        margin-bottom: 4px;
        font-size: 11px;
        color: #7a8398;
      }
      .font-settings-field input {
        width: 100%;
        height: 34px;
        border: 1px solid #c9ced7;
        border-radius: 10px;
        background: #fefdfb;
        padding: 0 10px;
        color: #4b5568;
      }
      .font-settings-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      .font-settings-actions button {
        height: 34px;
        border-radius: 10px;
        padding: 0 12px;
      }
      .app-menu-panel {
        position: fixed;
        top: 0;
        left: 0;
        min-width: 220px;
        border: 1px solid #c9ced7;
        border-radius: 14px;
        background: #fffefd;
        box-shadow: 0 18px 40px rgba(34, 40, 52, 0.18);
        padding: 6px;
        z-index: 50;
      }
      .app-menu-panel[hidden] {
        display: none;
      }
      .app-menu-item {
        display: flex;
        width: 100%;
        align-items: center;
        border: 0;
        border-radius: 10px;
        background: transparent;
        padding: 9px 10px;
        color: #4b5568;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      .app-menu-item:hover {
        background: #f3f5f8;
        color: #3f628f;
      }
      .local-path-link {
        color: #4e6f9f;
        text-decoration: none;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .local-path-link:hover {
        text-decoration: underline;
      }
      .usage-ref-link,
      .usage-refs-trigger {
        color: #4e6f9f;
        text-decoration: none;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .usage-ref-link:hover,
      .usage-refs-trigger:hover {
        text-decoration: underline;
      }
      .markdown-preview a[href^="http://"],
      .markdown-preview a[href^="https://"],
      .markdown-preview a[data-attachment-link="true"] {
        color: #4e6f9f;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .markdown-preview li::marker {
        color: #a98b66;
      }
      .markdown-preview .mermaid {
        margin: 0.9em 0;
        overflow-x: auto;
        border-radius: 10px;
        background: #fefdfb;
        padding: 8px;
      }
      .markdown-preview .mermaid svg {
        max-width: 100%;
        height: auto;
      }
      .markdown-preview .mermaid-error {
        color: #9a4b5f;
        white-space: pre-wrap;
      }
      .markdown-preview .md-dash-list-item {
        position: relative;
        display: block !important;
        margin-left: 0;
        padding-left: 1.05em;
      }
      .markdown-preview .md-dash-list-item::before {
        content: "-";
        position: absolute;
        left: 0;
        color: #a98b66;
        opacity: 0.9;
      }
      .quick-memo-thread {
        background: transparent !important;
        border-color: transparent !important;
        box-shadow: none !important;
        color: #4f5f7e !important;
        font-size: 13px !important;
        line-height: 1rem !important;
        font-weight: 700 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      .quick-memo-thread::placeholder {
        color: #4f5f7e;
      }
      #usagePanelSlot.sticky-slot-scrolled {
        box-shadow: 0 8px 14px -12px rgba(92, 78, 57, 0.45);
        border-bottom: 1px solid rgba(201, 191, 177, 0.9);
      }
      .status-banner {
        position: absolute;
        right: 10px;
        bottom: 8px;
        z-index: 120;
        width: min(370px, calc(100vw - 34px));
        min-height: 54px;
        padding: 8px 14px 10px;
        border: 1px solid rgba(168, 177, 194, 0.18);
        border-bottom: 1px solid rgba(0, 0, 0, 0.58);
        border-right: 0;
        border-radius: 8px 6px 0 0;
        background: rgba(92, 92, 98, 0.74);
        box-shadow: 0 12px 28px rgba(23, 28, 38, 0.22);
        color: #f5f7fb;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: 0;
        transform: translate3d(0, 18px, 0) scale(0.88, 0.78);
        transform-origin: right bottom;
        transition:
          transform 760ms cubic-bezier(0.16, 0.86, 0.28, 1.08),
          opacity 620ms ease,
          background 180ms ease,
          color 180ms ease;
        pointer-events: none;
        cursor: pointer;
      }
      .status-banner.is-visible {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1, 1);
        pointer-events: auto;
      }
      .status-banner.is-error {
        color: #f5f7fb;
      }
      .status-banner.is-danger {
        color: #f5f7fb;
      }
      .status-banner.is-force {
        color: #f5f7fb;
      }
      .status-banner__title {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        color: rgba(255, 255, 255, 0.9);
      }
      .status-banner__icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 1px solid rgba(132, 214, 171, 0.72);
        background: rgba(82, 176, 118, 0.28);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 6px rgba(82, 176, 118, 0.24);
        font-size: 8px;
        font-weight: 800;
        line-height: 1;
        color: #bdf3cb;
      }
      .status-banner.is-error .status-banner__icon {
        border-color: rgba(255, 212, 122, 0.76);
        background: rgba(214, 171, 79, 0.32);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 6px rgba(214, 171, 79, 0.26);
        color: #ffd978;
      }
      .status-banner.is-danger .status-banner__icon {
        border-color: rgba(255, 164, 188, 0.76);
        background: rgba(214, 105, 142, 0.3);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 6px rgba(214, 105, 142, 0.26);
        color: #ffb3c8;
      }
      .status-banner.is-force .status-banner__icon {
        border-color: rgba(132, 214, 171, 0.8);
        background: rgba(82, 176, 118, 0.3);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 6px rgba(82, 176, 118, 0.26);
        color: #c7f3d2;
      }
      .status-banner__text {
        margin: 0;
        font-size: 12px;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 900px) {
        .status-banner {
          right: 8px;
          bottom: 6px;
          width: min(320px, calc(100vw - 20px));
          min-height: 50px;
          padding: 7px 12px 9px;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#f6f7f5] px-2 pb-0 pt-2 text-[#4b5568]">
    <div class="relative mx-auto flex h-[calc(100vh-0.5rem)] max-w-[1320px] flex-col overflow-hidden rounded-b-[18px] bg-[#f6f7f5]">
      <header class="flex items-center gap-1.5 overflow-x-auto rounded-t-2xl border border-[#b8b8b8] bg-[#ffffff] px-2.5 py-1.5 whitespace-nowrap">
        <div class="ml-1 mr-1 inline-flex shrink-0 items-center gap-1.5">

          <button id="modeBadge" type="button" class="inline-flex h-5 items-center rounded-md border bg-transparent px-1 text-[10px] font-semibold leading-none" title="Mode">-</button>
        </div>
        <input id="qInput" type="search" placeholder="Search" class="h-7 w-[190px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]" />
        <input id="projectInput" type="search" placeholder="projectName" class="h-7 w-[152px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]" />
        <div class="ml-0.5 flex items-center gap-1.5">
          <select id="typeSelect" tabindex="-1" class="h-7 w-[98px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]">
            <option value="">Types</option>
            <option value="memo">memo</option>
            <option value="handover memo">handover</option>
            <option value="propomemo">propo</option>
            <option value="keep">keep</option>
          </select>
          <div id="storageFilterWrap" class="flex items-center">
            <select id="storageFilterSelect" tabindex="-1" class="h-7 w-[98px] rounded-lg border border-[#e7e1d7] bg-[#fefdfb] px-2 text-xs outline-none focus:border-[#7f90b0]">

            </select>
          </div>
          <button id="newBtn" tabindex="-1" type="button" aria-label="New memo" title="New memo" class="ml-3 inline-flex h-7 w-7 items-center justify-center rounded-lg border border-[#e7e1d7] bg-[#fefdfb] p-0 hover:border-[#7f90b0]">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-[#6e7d99]" stroke-width="2" stroke-linecap="round">

          <button id="archiveBtn" tabindex="-1" type="button" class="h-7 rounded-lg border border-[#9a8454] bg-[#fffaf0] px-2 text-xs text-[#725e35] hover:border-[#806a39] disabled:cursor-not-allowed disabled:opacity-45">Archive</button>
          <button id="deleteBtn" tabindex="-1" type="button" class="h-7 rounded-lg border border-[#cf7896] bg-[#cf7896] px-2 text-xs text-[#fff7fb] hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-45 disabled:hover:brightness-100">Delete</button>
          <div class="relative ml-1">
            <button id="appMenuBtn" tabindex="-1" type="button" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false" class="inline-flex h-8 w-8 items-center justify-center rounded-full border-0 bg-transparent p-0 text-[#667792] transition-transform duration-150 hover:scale-[1.06] hover:text-[#496894] focus:outline-none focus:ring-2 focus:ring-[#9db1cf]/70">
              <svg viewBox="0 0 24 24" aria-hidden="true" class="h-6 w-6 fill-none stroke-current" stroke-width="2.15" stroke-linecap="round">
                <path d="M5 7h14"></path>
                <path d="M5 12h14"></path>
                <path d="M5 17h14"></path>
              </svg>
            </button>
            <div id="appMenuPanel" class="app-menu-panel" role="menu" aria-labelledby="appMenuBtn" hidden>
              <button id="menuMemoFontBtn" type="button" class="app-menu-item" role="menuitem">Memo Font...</button>
              <button id="menuMarkdownCssBtn" type="button" class="app-menu-item" role="menuitem">Edit Markdown CSS</button>
            </div>
          </div>
        </div>
      </header>

      <main class="relative grid min-h-0 flex-1 grid-cols-1 md:grid-cols-[300px_minmax(0,1fr)]">
        <aside id="memoSidebar" class="flex min-h-0 flex-col overflow-hidden border-b border-[#dcdcdc] bg-[#f6f7f5] md:border-b-0 md:border-r">

                <option value="handover memo">handover</option>
                <option value="propomemo">propo</option>
                <option value="keep">keep</option>
              </select>

                  <svg viewBox="0 0 24 24" aria-hidden="true" class="h-[18px] w-[18px] fill-none stroke-[#6e7d99]" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

                </button>
              </div>
              <textarea id="memoBodyInput" rows="14" class="h-full min-h-0 flex-1 resize-y rounded-xl border border-[#c9ced7] bg-[#fefdfb] px-2 py-2 text-sm outline-none focus:border-[#7f90b0]"></textarea>
              <article id="memoPreview" class="markdown-preview hidden h-full min-h-0 flex-1 overflow-auto rounded-xl border border-[#c9ced7] bg-[#fefdfb] px-3 py-2 text-sm"></article>
            </div>
            <div class="-mx-4 mt-0.5 shrink-0 border-t border-[#d8d2c8] bg-[#eeefed] px-4 py-0.5">
              <input id="attachmentInput" type="file" accept="image/*,application/pdf,.pdf" multiple class="hidden" />
              <div class="relative flex h-6 items-center gap-1.5">
                <button id="addImageBtn" tabindex="-1" type="button" aria-label="Add attachment" title="Add attachment" class="inline-flex h-6 w-6 shrink-0 items-center justify-center text-[#5e6f8d] hover:text-[#7f90b0]">
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-current" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8.5 12.5 14 7a3 3 0 1 1 4.24 4.24l-7.07 7.07a5 5 0 0 1-7.07-7.07l7.43-7.43"></path>
                  </svg>
                </button>
                <button id="attachmentToggle" type="button" aria-expanded="false" class="hidden min-w-0 flex-1 truncate text-left text-[10px] leading-4 text-[#6f7b91] hover:text-[#56647d]"></button>
                <div id="attachmentList" class="absolute bottom-full left-0 right-0 z-20 mb-1 hidden max-h-40 flex-wrap items-center gap-1 overflow-auto rounded-lg border border-[#d8d2c8] bg-[#eeefed] p-2 text-[10px] text-[#7a8398] shadow-lg"></div>
              </div>
            </div>
          </div>

        </section>
      </main>
      <aside id="statusBanner" class="status-banner" aria-live="polite" aria-atomic="true">
        <div class="status-banner__title"><span id="statusIcon" class="status-banner__icon" aria-hidden="true">i</span><span id="statusTitle">Message</span></div>
        <p id="status" class="status-banner__text"></p>
      </aside>
      <dialog id="fontSettingsDialog" aria-labelledby="fontSettingsTitle">
        <form method="dialog" class="font-settings-shell">
          <div class="font-settings-head">
            <div>
              <h2 id="fontSettingsTitle" class="font-settings-title">Font settings</h2>
              <p class="font-settings-copy">未インストールのフォント名は自動で既定フォントへフォールバックするよ。</p>
            </div>
          </div>
          <div class="font-settings-grid">
            <div class="font-settings-field">
              <label for="memoFontNameInput">Memo font name</label>
              <input id="memoFontNameInput" type="text" placeholder='BIZ UDPGothic, Menlo, Hiragino Sans' />
            </div>
            <div class="font-settings-field">
              <label for="memoFontSizeInput">Memo size</label>
              <input id="memoFontSizeInput" type="number" min="10" max="32" step="1" placeholder="14" />
            </div>
          </div>
          <div class="font-settings-actions">
            <button id="fontSettingsResetBtn" type="button" class="border border-[#c9ced7] bg-[#fefdfb] text-[#4b5568]">Reset</button>
            <button id="fontSettingsCancelBtn" type="button" class="border border-[#c9ced7] bg-[#fefdfb] text-[#4b5568]">Cancel</button>
            <button id="fontSettingsSaveBtn" type="submit" class="border border-[#6e84ad] bg-[#6e84ad] text-[#f7f9ff]">Save</button>
          </div>
        </form>
      </dialog>
    </div>

    <script src="/markdown_theme_codex_memo.js?v=20260223-01"></script>
    <script src="/usage_overview_shared.js?v=20260608-01"></script>
    <script src="/app.js?v=20260608-01"></script>
  </body>
</html>
